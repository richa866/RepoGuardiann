version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONITOR_POLL_INTERVAL_SECONDS=300
      - DATABASE_PATH=/app/data/repoguardian.db
      - CHROMA_PATH=/app/data/chroma
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
