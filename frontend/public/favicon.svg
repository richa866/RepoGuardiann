<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="neonRim" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Neon Glow Ring -->
  <circle cx="64" cy="64" r="59" stroke="url(#neonRim)" stroke-width="4.5" filter="url(#cyanGlow)" />
  
  <!-- Metallic Coin Body -->
  <circle cx="64" cy="64" r="57" fill="url(#coinGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Inner Highlight Ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.25" />

